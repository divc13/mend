[package]
name = "mend-bid-rules"
version = "0.1.0"
edition = "2021"
publish = false
description = "MEND deterministic integer bid evaluation, safe for OutLayer WASI execution"

[lib]
name = "mend_bid_rules"
path = "src/lib.rs"

[[bin]]
name = "mend-bid-rules"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
