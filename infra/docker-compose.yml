# MEND local development stack.
#
# Usage (always from the repository root):
#   docker compose -f infra/docker-compose.yml up -d --build
#   bash scripts/dev.sh            # preferred: waits for health + seeds demo data
#
# Configuration is read from infra/.env (Compose loads the .env file that sits
# next to this file). Every value below has a safe, local-only default so that
# `docker compose config` validates on a clean checkout with no .env present.
# Never put real credentials in this file. See infra/env.example.

name: mend-local

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-environment: &api-environment
  NODE_ENV: ${NODE_ENV:-development}
  MEND_ENV: ${MEND_ENV:-local}
  MEND_MODE: ${MEND_MODE:-REPLAY}
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  LOG_FORMAT: ${LOG_FORMAT:-pretty}
  DATABASE_URL: ${DATABASE_URL:-postgres://mend:mend_local_dev_only@postgres:5432/mend}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-mend}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mend_local_dev_only}
  POSTGRES_DB: ${POSTGRES_DB:-mend}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-mend-local-minio}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-mend-local-minio-secret}
  S3_BUCKET_EVIDENCE: ${S3_BUCKET_EVIDENCE:-mend-evidence}
  S3_BUCKET_ARTIFACTS: ${S3_BUCKET_ARTIFACTS:-mend-artifacts}
  S3_SIGNED_URL_TTL_SECONDS: ${S3_SIGNED_URL_TTL_SECONDS:-300}
  NEAR_NETWORK: ${NEAR_NETWORK:-testnet}
  NEAR_RPC_URL: ${NEAR_RPC_URL:-https://rpc.testnet.near.org}
  NEAR_EXPLORER_URL: ${NEAR_EXPLORER_URL:-https://testnet.nearblocks.io}
  NEAR_HUB_ACCOUNT_ID: ${NEAR_HUB_ACCOUNT_ID:-mend-hub.testnet}
  NEAR_TOKEN_ACCOUNT_ID: ${NEAR_TOKEN_ACCOUNT_ID:-mend-usdc.testnet}
  NEAR_DAO_ACCOUNT_ID: ${NEAR_DAO_ACCOUNT_ID:-mend-dao.sputnikv2.testnet}
  NEAR_AI_BASE_URL: ${NEAR_AI_BASE_URL:-https://cloud-api.near.ai/v1}
  NEAR_AI_MODEL: ${NEAR_AI_MODEL:-near-ai-cloud-default}
  NEAR_AI_API_KEY: ${NEAR_AI_API_KEY:-}
  OUTLAYER_API_URL: ${OUTLAYER_API_URL:-}
  OUTLAYER_API_KEY: ${OUTLAYER_API_KEY:-}
  AGENT_MARKET_API_URL: ${AGENT_MARKET_API_URL:-}
  AGENT_MARKET_AGENT_TOKEN: ${AGENT_MARKET_AGENT_TOKEN:-}
  INTENTS_API_URL: ${INTENTS_API_URL:-https://1click.chaindefuser.com}
  INTENTS_JWT: ${INTENTS_JWT:-}
  INTENTS_DRY_RUN_DEFAULT: ${INTENTS_DRY_RUN_DEFAULT:-true}
  MEND_ALLOW_MAINNET: ${MEND_ALLOW_MAINNET:-false}
  MEND_MAINNET_HUMAN_APPROVED: ${MEND_MAINNET_HUMAN_APPROVED:-false}
  DEMO_RESET_ENABLED: ${DEMO_RESET_ENABLED:-true}
  DEMO_RESET_TOKEN: ${DEMO_RESET_TOKEN:-local-demo-reset-token}
  DEMO_DURABILITY_INTERVAL_MINUTES: ${DEMO_DURABILITY_INTERVAL_MINUTES:-2}
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mend_local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-mend}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - mend-local

  # Private evidence store. The init job creates private (no anonymous access)
  # buckets and enables object versioning for evidence retention.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    logging: *default-logging
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mend-local-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mend-local-minio-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - mend-local

  minio-init:
    image: minio/mc:latest
    restart: "no"
    logging: *default-logging
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mend-local-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mend-local-minio-secret}
      S3_BUCKET_EVIDENCE: ${S3_BUCKET_EVIDENCE:-mend-evidence}
      S3_BUCKET_ARTIFACTS: ${S3_BUCKET_ARTIFACTS:-mend-artifacts}
    entrypoint: ["/bin/sh", "-c"]
    command: |
      set -eu
      mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
      for bucket in "$$S3_BUCKET_EVIDENCE" "$$S3_BUCKET_ARTIFACTS"; do
        mc mb --ignore-existing "local/$$bucket"
        mc anonymous set none "local/$$bucket"
        mc version enable "local/$$bucket"
      done
      echo "minio-init: private buckets ready"
    networks:
      - mend-local

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
      target: dev
      args:
        NODE_VERSION: ${NODE_VERSION:-22}
        MEND_WORKSPACE: ${API_WORKSPACE:-@mend/api}
        MEND_APP_DIR: ${API_APP_DIR:-apps/api}
    image: mend-api:local
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *api-environment
      SERVICE_NAME: api
      API_PORT: ${API_PORT:-4000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:4000}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000}
      INDEXER_INTERNAL_URL: ${INDEXER_INTERNAL_URL:-http://indexer:4100}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ..:/app:cached
      - workspace_node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.API_PORT || '4000') + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - mend-local

  indexer:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
      target: dev
      args:
        NODE_VERSION: ${NODE_VERSION:-22}
        MEND_WORKSPACE: ${INDEXER_WORKSPACE:-@mend/indexer}
        MEND_APP_DIR: ${INDEXER_APP_DIR:-services/indexer}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *api-environment
      SERVICE_NAME: indexer
      INDEXER_PORT: ${INDEXER_PORT:-4100}
      INDEXER_MAX_LAG_BLOCKS: ${INDEXER_MAX_LAG_BLOCKS:-50}
      INDEXER_INTERNAL_URL: ${INDEXER_INTERNAL_URL:-http://indexer:4100}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000}
    ports:
      - "${INDEXER_PORT:-4100}:4100"
    volumes:
      - ..:/app:cached
      - workspace_node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.INDEXER_PORT || '4100') + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - mend-local

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      target: dev
      args:
        NODE_VERSION: ${NODE_VERSION:-22}
        MEND_WORKSPACE: ${WEB_WORKSPACE:-@mend/web}
        MEND_APP_DIR: ${WEB_APP_DIR:-apps/web}
    image: mend-web:local
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MEND_ENV: ${MEND_ENV:-local}
      MEND_MODE: ${MEND_MODE:-REPLAY}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_FORMAT: ${LOG_FORMAT:-pretty}
      WEB_PORT: ${WEB_PORT:-3000}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
      NEXT_PUBLIC_MEND_MODE: ${NEXT_PUBLIC_MEND_MODE:-REPLAY}
      NEAR_NETWORK: ${NEAR_NETWORK:-testnet}
      NEAR_EXPLORER_URL: ${NEAR_EXPLORER_URL:-https://testnet.nearblocks.io}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ..:/app:cached
      - workspace_node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.WEB_PORT || '3000') + '/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    networks:
      - mend-local

volumes:
  pgdata:
  miniodata:
  workspace_node_modules:

networks:
  mend-local:
    driver: bridge
