[workspace]
members = ["hub", "test-token"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mend/contracts"
rust-version = "1.86"

[workspace.dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
debug = false
